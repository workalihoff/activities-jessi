<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Builder — Week 11: Problem & Resolution | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --amber-bg:#FAEEDA;--amber-t:#633806;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.info-bar{background:#fff;border-bottom:1px solid var(--border);padding:.7rem 1.5rem;display:flex;align-items:center;gap:10px;justify-content:center}
.info-bar label{font-size:12.5px;color:var(--text3);font-weight:600}
.info-bar input{border:1px solid var(--border);border-radius:8px;padding:.35rem .7rem;font-size:13px;font-family:'Lato',sans-serif;width:200px}
.info-bar input:focus{outline:none;border-color:var(--teal-mid)}
.print-header{display:none}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.section-intro{text-align:center;padding:1.5rem 0}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:520px;margin:0 auto}
.phase-nav{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.5rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.word-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:1.25rem;overflow:hidden}
.wc-header{padding:1.25rem 1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;cursor:pointer;user-select:none}
.wc-word{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:3px}
.wc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wc-pos{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:10px;background:var(--teal-light);color:var(--teal-dark)}
.wc-toggle{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:var(--text3)}
.wc-body{padding:0 1.5rem 1.5rem;border-top:1px solid var(--border)}
.wc-def-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:.9rem 0 .35rem}
.wc-def{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:.75rem}
.example-list{display:flex;flex-direction:column;gap:.5rem}
.ex-item{background:var(--cream);border-radius:8px;padding:.65rem .9rem;font-size:13px;color:var(--text2);line-height:1.5;border-left:3px solid var(--teal-mid)}
.ex-item strong{color:var(--teal-dark);font-weight:700}
.ex-item .ex-ctx{font-size:11px;color:var(--text3);margin-top:3px}
.colloc-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:.25rem}
.colloc-chip{padding:5px 12px;border-radius:16px;font-size:12px;background:var(--teal-light);color:var(--teal-dark);font-weight:600;border:1px solid #9FE1CB}
.tip-box{background:var(--blue-bg);border-radius:8px;padding:.65rem .9rem;margin-top:.75rem;font-size:13px;color:var(--blue-t);line-height:1.5}
.confusion-box{background:var(--amber-bg);border-left:3px solid #BA7517;border-radius:0 8px 8px 0;padding:.7rem 1rem;margin:.75rem 0}
.confusion-box .cb-title{font-size:11px;font-weight:700;color:var(--amber-t);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.confusion-box p{font-size:13px;color:var(--amber-t);line-height:1.55}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-situation{background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:var(--teal-dark);margin-bottom:1rem}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:'Lato',sans-serif}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct,.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-word-tag{display:inline-block;font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:var(--teal);background:var(--teal-light);padding:4px 16px;border-radius:20px;margin-bottom:.75rem;border:1px solid #9FE1CB}
.write-ta{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;background:var(--cream);line-height:1.6}
.write-ta:focus{border-color:var(--teal-mid);background:#fff}
.print-mirror{display:none}
.export-box{background:var(--teal-light);border:1.5px dashed var(--teal-mid);border-radius:14px;padding:1.4rem;text-align:center;margin:1.5rem 0}
.export-box p{font-size:13px;color:var(--teal-dark);margin-bottom:.8rem}
.export-btn{background:var(--teal);color:#fff;border:none;padding:.7rem 1.6rem;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif}
.export-btn:hover{background:var(--teal-mid)}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn:hover{border-color:var(--teal-mid)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
@media print{
  .topbar,.info-bar,.phase-nav,.bottom-nav,.export-box{display:none !important}
  #phase-0{display:none !important}
  #phase-1,#phase-2{display:block !important}
  .write-ta{display:none !important}
  .print-mirror{display:block !important;white-space:pre-wrap;border:1px solid #999;border-radius:8px;padding:.6rem .85rem;font-size:12.5px;color:#000;background:#fff;margin-top:.2rem}
  .print-header{display:block !important;padding:0 0 1rem}
  .print-header h1{font-family:'Raleway',sans-serif;font-size:19px;color:#085041;margin-bottom:.3rem}
  .print-header .ph-meta{font-size:12px;color:#444}
  body{background:#fff}.shell{padding:1rem;max-width:100%}
  .quiz-card,.write-card{box-shadow:none;break-inside:avoid;border:1px solid #ccc}
  .q-opt.correct,.q-opt.revealed,.q-opt.incorrect{border-width:2px !important}
  .section-intro p{display:none}
}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}.wc-word{font-size:18px}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">Vocabulary Builder — Week 11</div><div class="topbar-sub">English with Ali · Problem &amp; Resolution Language</div></div>
  <div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:33%"></div></div><span class="prog-label" id="prog-label">Phase 1 of 3</span></div>
</div>
<div class="info-bar"><label for="sname">Your name:</label><input type="text" id="sname" placeholder="Jessi"></div>
<div class="print-header" id="print-header"></div>
<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Learn</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Quiz</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>
<script>
var WORDS=[
  {id:'pending',word:'Pending',pos:'adjective / verb',
   def:'Waiting to be processed, approved, or resolved. Something that has been submitted but not yet completed.',
   examples:[
     {text:'Your payment is currently <strong>pending</strong> — it should be processed within 24 hours.',ctx:'Email to a client asking about their payment.'},
     {text:'Three transactions are <strong>pending</strong> review by the compliance team.',ctx:'Internal status update.'},
     {text:'The case has been <strong>pending</strong> resolution since Monday.',ctx:'Escalation report.'}
   ],
   collocations:['pending review','pending approval','pending resolution','currently pending','status: pending'],
   tip:'💡 "Pending" means the action has started but the outcome hasn\'t happened yet. It\'s between submitted and completed.',
   confusion:'⚠️ "Pending" vs "processing": pending = waiting to start or be reviewed. Processing = actively being worked on right now.'},
  {id:'reject',word:'Reject / Rejection',pos:'verb / noun',
   def:'To refuse or decline a transaction, request, or document because it does not meet requirements.',
   examples:[
     {text:'The payment was <strong>rejected</strong> because the beneficiary account number was incorrect.',ctx:'Incident report.'},
     {text:'You will receive a <strong>rejection</strong> notice if the information does not match.',ctx:'Client notification email.'},
     {text:'The system automatically <strong>rejects</strong> any transaction that exceeds the daily limit.',ctx:'Process documentation.'}
   ],
   collocations:['reject a payment','rejection notice','automatic rejection','payment was rejected','reject a request'],
   tip:'💡 Reject (verb) → Rejection (noun). "The payment was rejected" → "The client received a rejection notice."',
   confusion:'⚠️ "Reject" is not the same as "return." A rejected payment doesn\'t go anywhere — it fails. A returned payment was processed but then sent back.'},
  {id:'resubmit',word:'Resubmit',pos:'verb',
   def:'To send something again after it was previously rejected, returned, or incomplete.',
   examples:[
     {text:'After correcting the account details, the client <strong>resubmitted</strong> the payment.',ctx:'Incident resolution note.'},
     {text:'Please <strong>resubmit</strong> your request with the correct documentation.',ctx:'Response email to a client.'},
     {text:'The payment will need to be <strong>resubmitted</strong> by end of day to meet the processing deadline.',ctx:'Urgent notification.'}
   ],
   collocations:['resubmit a payment','resubmit the request','resubmit with correct details','please resubmit','resubmitted successfully'],
   tip:'💡 Re- = again. Resubmit = submit again. Same pattern: re-send, re-process, re-submit.',
   confusion:'⚠️ You resubmit after a rejection. You don\'t resubmit a pending payment — you wait for it.'},
  {id:'reverse',word:'Reverse / Reversal',pos:'verb / noun',
   def:'To undo a transaction that has already been processed — sending funds back to their original source.',
   examples:[
     {text:'The transaction was <strong>reversed</strong> after the client reported it was sent to the wrong account.',ctx:'Incident report.'},
     {text:'A <strong>reversal</strong> request must be submitted within 48 hours of the original transaction.',ctx:'Policy document.'},
     {text:'The bank initiated a <strong>reversal</strong> and the funds were returned within two business days.',ctx:'Client communication.'}
   ],
   collocations:['reverse a transaction','request a reversal','initiate a reversal','reversal was processed','reversal request'],
   tip:'💡 A reversal undoes something that already happened. A rejection stops something before it happens.',
   confusion:'⚠️ Reversal vs. rejection: rejection = payment never went through. Reversal = payment went through but was undone afterward.'},
  {id:'notify',word:'Notify / Notification',pos:'verb / noun',
   def:'To officially inform someone about something — a status update, an issue, or an action taken.',
   examples:[
     {text:'The client was <strong>notified</strong> by email as soon as the payment was rejected.',ctx:'Incident resolution report.'},
     {text:'An automatic <strong>notification</strong> is sent to the account holder whenever a transaction is flagged.',ctx:'System documentation.'},
     {text:'Please <strong>notify</strong> the operations team if a reversal takes more than 48 hours.',ctx:'Internal process guide.'}
   ],
   collocations:['notify the client','send a notification','automatic notification','was notified','notification was sent'],
   tip:'💡 Notify (verb) → Notification (noun). Compare: "We notified the client" → "The client received a notification."',
   confusion:'⚠️ "Notify" is more formal than "tell" or "inform." In professional banking contexts, always prefer "notify" or "inform."'},
  {id:'flag',word:'Flag',pos:'verb / noun',
   def:'To mark a transaction, account, or issue for special attention or manual review — usually because something looks unusual or requires follow-up.',
   examples:[
     {text:'The compliance system <strong>flagged</strong> the transaction because it exceeded the reporting threshold.',ctx:'Compliance report.'},
     {text:'I <strong>flagged</strong> this account for manual review — the activity pattern looks unusual.',ctx:'Internal note to supervisor.'},
     {text:'Once an account is <strong>flagged</strong>, all transactions are held pending review.',ctx:'Policy document.'}
   ],
   collocations:['flag a transaction','flag an account','flag for review','was flagged by the system','raise a flag'],
   tip:'💡 Think of a flag as a signal — you\'re raising it to say "pay attention to this." It doesn\'t mean the transaction is wrong, just that it needs a closer look.',
   confusion:'⚠️ Flagging doesn\'t automatically reject or reverse anything. It marks something for attention so a human can review it and decide what to do.'}
];

var QUIZ=[
  {id:'q1',situation:'A payment was submitted three days ago and is still waiting to be processed.',
   prompt:'Which word best describes its current status?',
   options:['The payment has been reversed.','The payment is currently pending.','The payment was rejected.','The payment has been flagged.'],
   correct:1,explain:'"Pending" = submitted but not yet completed. The payment is waiting in the queue. Reversed, rejected, and flagged all imply something went wrong or someone acted on it.'},
  {id:'q2',situation:"A client's payment didn't go through because the beneficiary account number was wrong.",
   prompt:'What happened to the payment?',
   options:['It was flagged.','It was reversed.','It was resubmitted.','It was rejected.'],
   correct:3,explain:'"Rejected" = the payment failed because it didn\'t meet requirements. It was never processed. "Reversed" would mean it went through and was then undone.'},
  {id:'q3',situation:'After fixing the account number error, the client sends the payment again.',
   prompt:'What did the client do?',
   options:['The client resubmitted the payment.','The client reversed the payment.','The client flagged the payment.','The client notified the payment.'],
   correct:0,explain:'"Resubmit" = send again after a previous rejection or failure. The client corrected the issue and tried again.'},
  {id:'q4',situation:'A payment was processed and sent, but the client then realized it went to the wrong account. The bank undoes it.',
   prompt:'What did the bank do?',
   options:['The bank rejected the transaction.','The bank flagged the account.','The bank reversed the transaction.','The bank resubmitted the payment.'],
   correct:2,explain:'"Reverse" = undo a transaction that was already processed. The payment went through, so it can\'t be rejected — it has to be reversed.'},
  {id:'q5',situation:'Your system sends an automatic message to the client confirming their payment was rejected.',
   prompt:'What did the system send?',
   options:['A reversal.','A notification.','A flag.','A resubmission.'],
   correct:1,explain:'"Notification" = an official message informing someone of a status or action. The system notified the client → the client received a notification.'},
  {id:'q6',situation:'The compliance team marks an account for manual review because the transaction volume looks unusual.',
   prompt:'What did the compliance team do?',
   options:['They reversed the account.','They notified the account.','They rejected the account.','They flagged the account.'],
   correct:3,explain:'"Flag" = mark for attention or review. The compliance team didn\'t reject or reverse anything — they raised a flag for someone to look at it.'},
  {id:'q7',situation:"You're writing a professional email to a client whose payment is waiting to be processed.",
   prompt:'Which sentence is correct?',
   options:['Your payment is currently pending review.','Your payment is currently flagging review.','Your payment is currently reversing review.','Your payment is currently rejecting review.'],
   correct:0,explain:'"Pending review" is the correct collocation — it means the payment is waiting to be reviewed. The other verbs don\'t work with "review" in this context.'}
];

var WRITE_TASKS=[
  {word:'pending / rejected',prompt:'Describe a real or realistic situation where a payment or request was pending or rejected at your bank. What happened?',hint:'Try: "The payment was rejected because..." or "The request has been pending since..."'},
  {word:'resubmit / reverse',prompt:'Write 2 sentences: one about resubmitting something, one about reversing a transaction. Use real or realistic work situations.',hint:'"After correcting the details, the client resubmitted..." / "The transaction was reversed because..."'},
  {word:'notify / flag',prompt:'Write a sentence about notifying a client or stakeholder, and another about flagging something for review. Think about your actual processes.',hint:'"The client was notified that..." / "The account was flagged because..."'}
];

var currentPhase=0,quizAnswers={},writeAnswers={};

function updateProgress(){
  var labels=['Phase 1 of 3 — Learn','Phase 2 of 3 — Quiz','Phase 3 of 3 — Write'];
  document.getElementById('prog').style.width=[33,66,100][currentPhase]+'%';
  document.getElementById('prog-label').textContent=labels[currentPhase];
}
function goPhase(n){
  document.getElementById('phase-'+currentPhase).style.display='none';
  document.querySelectorAll('.phase-tab').forEach(function(t,i){t.classList.toggle('active',i===n);});
  currentPhase=n;document.getElementById('phase-'+n).style.display='block';
  updateProgress();window.scrollTo({top:0,behavior:'smooth'});
  if(n===0)renderLearn();if(n===1)renderQuiz();if(n===2)renderWrite();
}
function renderLearn(){
  var el=document.getElementById('phase-0');
  var html='<div class="section-intro"><h2>Phase 1 — Learn</h2><p>Six words you will use every time something goes wrong with a payment or process at work. All six are directly connected to today\'s session.</p></div>';
  WORDS.forEach(function(w){
    html+='<div class="word-card"><div class="wc-header" onclick="toggleCard(\''+w.id+'\')"><div><div class="wc-word">'+w.word+'</div><div class="wc-meta"><span class="wc-pos">'+w.pos+'</span></div></div><div class="wc-toggle" id="toggle-'+w.id+'">▼</div></div><div class="wc-body" id="wbody-'+w.id+'" style="display:none">';
    html+='<div class="wc-def-label">Definition</div><div class="wc-def">'+w.def+'</div>';
    html+='<div class="wc-def-label">Examples in context</div><div class="example-list">';
    w.examples.forEach(function(e){html+='<div class="ex-item">'+e.text+'<div class="ex-ctx">📍 '+e.ctx+'</div></div>';});
    html+='</div><div class="wc-def-label">Common collocations</div><div class="colloc-row">';
    w.collocations.forEach(function(c){html+='<span class="colloc-chip">'+c+'</span>';});
    html+='</div><div class="confusion-box"><div class="cb-title">⚠️ Don\'t confuse</div><p>'+w.confusion.replace('⚠️ ','')+'</p></div>';
    html+='<div class="tip-box">'+w.tip+'</div></div></div>';
  });
  html+='<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">6 words covered</span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Quiz →</button></div>';
  el.innerHTML=html;
}
function toggleCard(id){
  var b=document.getElementById('wbody-'+id),t=document.getElementById('toggle-'+id);
  var open=b.style.display!=='none';b.style.display=open?'none':'block';t.textContent=open?'▼':'▲';
}
function renderQuiz(){
  var el=document.getElementById('phase-1');
  var html='<div class="section-intro"><h2>Phase 2 — Quiz</h2><p>Choose the best word for each work situation.</p></div>';
  QUIZ.forEach(function(q,qi){
    var answered=quizAnswers[q.id]!==undefined;
    html+='<div class="quiz-card"><div class="quiz-num">Question '+(qi+1)+' of '+QUIZ.length+'</div>';
    html+='<div class="quiz-situation"><strong>Situation:</strong> '+q.situation+'</div>';
    html+='<div class="quiz-prompt">'+q.prompt+'</div><div class="quiz-options">';
    q.options.forEach(function(opt,oi){
      var cls='';if(answered){if(oi===q.correct)cls='revealed';else if(quizAnswers[q.id]===oi)cls='incorrect';}
      html+='<button class="q-opt '+cls+'" data-qid="'+q.id+'" data-oi="'+oi+'" onclick="answerQuiz(this)"><span class="q-letter">'+String.fromCharCode(65+oi)+'</span><span class="q-text">'+opt+'</span></button>';
    });
    html+='</div>';
    if(answered){var c=quizAnswers[q.id]===q.correct;html+='<div class="quiz-feedback '+(c?'correct':'incorrect')+' show">'+(c?'✓ ':'✗ ')+q.explain+'</div>';}
    html+='</div>';
  });
  var allDone=Object.keys(quizAnswers).length===QUIZ.length;
  html+='<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Back to Learn</button><button class="nav-btn primary" onclick="goPhase(2)" '+(allDone?'':'disabled')+'>Continue to Write →</button></div>';
  el.innerHTML=html;
}
function answerQuiz(btn){
  var qid=btn.dataset.qid,oi=parseInt(btn.dataset.oi);
  if(quizAnswers[qid]!==undefined)return;quizAnswers[qid]=oi;renderQuiz();
}
function renderWrite(){
  var el=document.getElementById('phase-2');
  var html='<div class="section-intro"><h2>Phase 3 — Write in Context</h2><p>Use the new vocabulary in real sentences from your work. Think about what actually happens in your team when a process goes wrong.</p></div>';
  WRITE_TASKS.forEach(function(task,ti){
    var val=writeAnswers[ti]||'';
    html+='<div class="write-card"><span class="write-word-tag">'+task.word+'</span>';
    html+='<div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:.5rem">'+task.prompt+'</div>';
    html+='<div style="font-size:12px;color:var(--text3);margin-bottom:.65rem;font-style:italic">💭 '+task.hint+'</div>';
    html+='<textarea class="write-ta" id="wta-'+ti+'" placeholder="Write here..." oninput="writeAnswers['+ti+']=this.value">'+escHtml(val)+'</textarea>';
    html+='<div class="print-mirror" id="mirror-wta-'+ti+'"></div></div>';
  });
  html+='<div class="export-box"><p>📄 Done? Export your quiz responses and written answers as a PDF to submit.</p><button class="export-btn" onclick="exportPDF()">Export to PDF</button></div>';
  html+='<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Back to Quiz</button><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>';
  el.innerHTML=html;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function exportPDF(){
  var name=document.getElementById('sname').value.trim()||'_____________';
  var date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  document.getElementById('print-header').innerHTML='<h1>Vocabulary Builder — Week 11: Problem &amp; Resolution Language</h1><div class="ph-meta"><strong>Student:</strong> '+escHtml(name)+' &nbsp;|&nbsp; <strong>Date:</strong> '+date+'</div>';
  renderQuiz();renderWrite();
  WRITE_TASKS.forEach(function(_,ti){var m=document.getElementById('mirror-wta-'+ti);if(m)m.textContent=writeAnswers[ti]&&writeAnswers[ti].trim()?writeAnswers[ti]:'(not answered)';});
  window.print();
}
renderLearn();updateProgress();
</script>
</body>
</html>
