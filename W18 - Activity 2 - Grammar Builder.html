<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Builder — Week 18 | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.section-intro{text-align:center;padding:2rem 0 1.5rem}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:540px;margin:0 auto}
.phase-nav{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pattern-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:1.25rem;overflow:hidden}
.pc-header{padding:1.25rem 1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;cursor:pointer;user-select:none}
.pc-name{font-family:'Raleway',sans-serif;font-size:18px;font-weight:700;color:var(--teal)}
.pc-formula{font-size:13px;color:var(--teal-dark);font-family:'Lato',sans-serif;background:var(--teal-light);display:inline-block;padding:3px 12px;border-radius:8px;margin-top:5px;font-weight:600}
.pc-toggle{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:var(--text3)}
.pc-body{padding:0 1.5rem 1.5rem;border-top:1px solid var(--border)}
.pc-def-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:.9rem 0 .35rem}
.example-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.25rem}
.ex-item{background:var(--cream);border-radius:8px;padding:.65rem .9rem;font-size:13px;color:var(--text2);line-height:1.5;border-left:3px solid var(--teal-mid)}
.ex-item strong{color:var(--teal-dark);font-weight:700}
.ex-context{font-size:11px;color:var(--text3);margin-top:3px}
.ex-wrong{background:var(--red-bg);border-left:3px solid #E24B4A;border-radius:8px;padding:.5rem .9rem;font-size:13px;color:var(--red-t);margin-top:.4rem}
.ex-wrong::before{content:'✗ ';font-weight:700}
.compare-card{background:var(--card);border:2px solid var(--terra);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.compare-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:var(--terra);margin-bottom:1rem}
.compare-table{width:100%;border-collapse:collapse;font-size:13px}
.compare-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:.4rem .5rem;border-bottom:2px solid var(--border)}
.compare-table td{padding:.6rem .5rem;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
.compare-table .ok{color:var(--green-t);font-weight:600}
.compare-table .no{color:var(--red-t);font-weight:600}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-situation{background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:var(--teal-dark);margin-bottom:1rem}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;transition:all .15s;font-family:'Lato',sans-serif;width:100%}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct,.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-card.capstone{border:2px solid var(--terra);background:var(--terra-light)}
.write-word-tag{display:inline-block;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;color:var(--teal);background:var(--teal-light);padding:4px 16px;border-radius:20px;margin-bottom:.75rem;border:1px solid #9FE1CB}
.capstone .write-word-tag{color:var(--terra);background:#fff;border-color:var(--terra)}
.write-reminder{background:var(--cream);border-radius:8px;padding:.6rem .9rem;font-size:12px;color:var(--text3);margin-bottom:1rem;line-height:1.5}
.capstone .write-reminder{background:#fff}
.write-reminder strong{color:var(--text2);font-weight:600}
.write-ta{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;transition:border-color .15s;line-height:1.6;background:var(--cream)}
.capstone .write-ta{min-height:120px;background:#fff}
.write-ta:focus{border-color:var(--teal-mid);background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.self-eval{margin-top:.75rem;display:none}
.self-eval.show{display:block}
.self-eval-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.4rem}
.self-btns{display:flex;gap:7px;flex-wrap:wrap}
.self-btn{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.self-btn.picked-yes{background:var(--green-bg);border-color:var(--green-b);color:var(--green-t)}
.self-btn.picked-unsure{background:#FAEEDA;border-color:#BA7517;color:#633806}
.self-btn.picked-no{background:var(--red-bg);border-color:#E24B4A;color:var(--red-t)}
.check-btn{margin-top:.75rem;padding:.5rem 1.1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.check-btn.done{background:var(--teal-light);border-color:var(--teal-mid);color:var(--teal-dark)}
.model-answer{margin-top:.75rem;padding:.65rem .9rem;background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;font-size:13px;color:var(--teal-dark);line-height:1.55;display:none}
.model-answer.show{display:block}
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.25rem}
.result-score{font-family:'Raleway',sans-serif;font-size:54px;font-weight:700;color:var(--teal);line-height:1}
.result-denom{font-size:20px;color:var(--text3)}
.result-note{font-size:14px;color:var(--text2);max-width:420px;margin:.75rem auto 0;line-height:1.6}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.pdf-btn{position:fixed;bottom:22px;right:22px;background:var(--teal);color:#fff;border:none;border-radius:30px;padding:.8rem 1.4rem;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(15,110,86,.35);display:none;align-items:center;gap:8px;z-index:60}
.pdf-btn.show{display:flex}
.pdf-btn:hover{background:var(--teal-mid)}
@media print{
  .topbar,.phase-nav,.pdf-btn,.bottom-nav,.check-btn,.self-btns{display:none !important}
  #phase-0,#phase-1,#phase-2{display:block !important}
  .pattern-card,.quiz-card,.write-card,.compare-card{break-inside:avoid;margin-bottom:1rem}
  body{background:#fff}
}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}.pc-name{font-size:16px}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">Grammar Builder — Week 18</div><div class="topbar-sub">English with Ali · Precision Patterns</div></div>
  <div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:0%"></div></div><span class="prog-label" id="prog-label">Phase 1 of 3</span></div>
</div>
<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Learn</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Quiz</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>
<button class="pdf-btn" id="pdfBtn" onclick="exportPDF()">📄 Export to PDF</button>

<script>
// Lighter-load activity — 3 focused patterns, straight from real writing this month, not a new topic.
const PATTERNS = [
  {id:'p1',name:'"Is / Was" + TO + Verb',formula:'is/was + TO + base verb',
    def:'When "is" or "was" introduces what something involves, or what a plan/goal is, English needs "to" before the verb. Without "to," the sentence breaks.',
    examples:[
      {text:'The first activity <strong>is to review</strong> the vendor files.',context:'Describing what a task involves.'},
      {text:'The goal <strong>was to finish</strong> by Friday.',context:'Describing a plan or objective.'},
      {text:'My job <strong>is to oversee</strong> the onboarding process.',context:'Describing a role.'},
    ],
    wrong:'"The first activity is review the vendor files." — missing "to" between "is" and the verb.'},

  {id:'p2',name:'Adjective Order',formula:'ADJECTIVE + noun',
    def:'Descriptive adjectives go BEFORE the noun in English — the opposite of the usual Spanish order, where they often come after.',
    examples:[
      {text:'I need <strong>additional information</strong> before I can confirm.',context:'Not "information additional."'},
      {text:'We received a <strong>signed document</strong> from the vendor.',context:'Not "document signed."'},
      {text:'This is an <strong>urgent request</strong>.',context:'Not "request urgent."'},
    ],
    wrong:'"I need information additional." — the adjective needs to move before the noun.'},

  {id:'p3',name:'"Already" Placement',formula:'have/has + ALREADY + participle',
    def:'"Already" usually sits between the auxiliary (have/has/had/will) and the main verb — or right before the main verb in simple tenses.',
    examples:[
      {text:'I\'ve <strong>already sent</strong> it.',context:'have + already + participle.'},
      {text:'She\'s <strong>already finished</strong> the report.',context:'Same pattern.'},
      {text:'He <strong>already knows</strong> about it.',context:'Simple present: already right before the main verb.'},
    ],
    wrong:'"I have sent already it." — "already" needs to move between "have" and "sent," and "it" goes at the end.'},
];

const COMPARE_ROWS = [
  ['is + to', 'The goal is <strong>to</strong> finish', 'The goal is finish ❌'],
  ['adjective order', '<strong>additional</strong> information', 'information additional ❌'],
  ['already', 'I\'ve <strong>already</strong> sent it', 'I have sent already it ❌'],
];

const QUIZ = [
  {id:'q1',situation:'You\'re describing what your main task involves this week.',
    prompt:'Which sentence is correct?',
    options:['My main task is review the vendor files.','My main task is to review the vendor files.','My main task is to reviewing the vendor files.','My main task to review the vendor files.'],
    correct:1,
    correctMsg:'Right — "is" needs "to" before the base verb when describing what a task or role involves.',
    incorrectMsg:'The correct structure is "is + to + base verb": "My main task is to review the vendor files."'},
  {id:'q2',situation:'You need more details before you can confirm something.',
    prompt:'Which sentence is correct?',
    options:['I need information additional.','I need additional the information.','I need additional information.','I need the additional information more.'],
    correct:2,
    correctMsg:'Right — the adjective "additional" goes before the noun "information," just like in English generally.',
    incorrectMsg:'Adjectives go before the noun in English: "I need additional information," not after it.'},
  {id:'q3',situation:'Someone asks if you\'ve sent a file yet, and you have.',
    prompt:'Which sentence is correct?',
    options:['I sent already it.','I have sent already it.','I\'ve already sent it.','Already I\'ve sent it.'],
    correct:2,
    correctMsg:'Right — "already" sits between the auxiliary "have" and the participle "sent," and the object comes at the end.',
    incorrectMsg:'"Already" goes between the auxiliary and the main verb: "I\'ve already sent it."'},
  {id:'q4',situation:'You\'re explaining what the new policy involves to a colleague.',
    prompt:'Which sentence is correct?',
    options:['The new policy is require a signature.','The new policy requires to a signature.','The new policy is to require a signature.','The new policy is to requiring a signature.'],
    correct:2,
    correctMsg:'Right — "is to require" follows the same is + to + base verb pattern.',
    incorrectMsg:'The pattern is "is + to + base verb": "The new policy is to require a signature."'},
  {id:'q5',situation:'A colleague asks if Vinicio has finished his part of the report.',
    prompt:'Which sentence is correct?',
    options:['He has already finish it.','He has finished it already.','He\'s already finished it.','He\'s finished already it.'],
    correct:2,
    correctMsg:'Right — "already" between the auxiliary and the participle is the most natural placement.',
    incorrectMsg:'The most natural placement is between the auxiliary and the participle: "He\'s already finished it." ("He has finished it already" is also acceptable, but less common mid-sentence.)'},
];

const WRITE_TASKS = [
  {word:'is/was + to',prompt:'Write a sentence describing what a task, goal, or role involves, using "is/was + to + verb."',hint:'Think of something you or a colleague is responsible for.',model:'My main responsibility this week is to oversee the vendor documentation.'},
  {word:'adjective order',prompt:'Write a sentence using an adjective before a noun (like "urgent," "signed," "additional").',hint:'Think of a document, request, or piece of information at work.',model:'We received an urgent request from the regional office this morning.'},
  {word:'already',prompt:'Write a sentence about something you or a colleague has already done, using "already" in the correct position.',hint:'Careful — "already" goes between the auxiliary and the main verb.',model:'I\'ve already confirmed the numbers with Priya.'},
];

const CAPSTONE = {prompt:'Write a short paragraph (3–5 sentences) about your week, using all three patterns at least once: is/was + to, adjective order, and already.',hint:'Think of a real task, something you already finished, and a document or request you\'d describe with an adjective.'};

let currentPhase=0;const quizAnswers={};const writeAnswers={};const writeSelf={};let capstoneText='';let openCards={};

function updateProgress(){const phases=['Phase 1 of 3 — Learn','Phase 2 of 3 — Quiz','Phase 3 of 3 — Write'];const pcts=[33,66,100];document.getElementById('prog').style.width=pcts[currentPhase]+'%';document.getElementById('prog-label').textContent=phases[currentPhase];}
function goPhase(n){document.getElementById('phase-'+currentPhase).style.display='none';document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===n));currentPhase=n;document.getElementById('phase-'+n).style.display='block';updateProgress();window.scrollTo({top:0,behavior:'smooth'});if(n===1)renderQuiz();if(n===2)renderWrite();}

function renderLearn(){
  const el=document.getElementById('phase-0');
  let html=`<div class="section-intro"><h2>Phase 1 — Learn the Patterns</h2><p>Three precise fixes, straight from your own recent writing. Tap a card to expand it.</p></div>`;
  PATTERNS.forEach(p=>{
    const isOpen=openCards[p.id]!==false;
    html+=`<div class="pattern-card" id="pcard-${p.id}"><div class="pc-header" onclick="toggleCard('${p.id}')"><div><div class="pc-name">${p.name}</div><div class="pc-formula">${p.formula}</div></div><div class="pc-toggle" id="toggle-${p.id}">${isOpen?'▲':'▼'}</div></div><div class="pc-body" id="pbody-${p.id}" style="display:${isOpen?'block':'none'}"><div class="pc-def-label">Definition</div><p style="font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:.75rem">${p.def}</p><div class="pc-def-label">Examples in context</div><div class="example-list">`;
    p.examples.forEach(ex=>{html+=`<div class="ex-item">${ex.text}<div class="ex-context">📍 ${ex.context}</div></div>`;});
    html+=`</div><div class="ex-wrong">${p.wrong}</div></div></div>`;
  });
  html+=`<div class="compare-card"><div class="compare-title">⚖️ Side-by-Side</div><table class="compare-table"><tr><th>Pattern</th><th>Correct</th><th>Common error</th></tr>`;
  COMPARE_ROWS.forEach(r=>{html+=`<tr><td>${r[0]}</td><td class="ok">${r[1]}</td><td class="no">${r[2]}</td></tr>`;});
  html+=`</table></div>`;
  html+=`<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">${PATTERNS.length} patterns</span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Quiz →</button></div>`;
  el.innerHTML=html;checkPdfBtn();
}
function toggleCard(id){const body=document.getElementById('pbody-'+id),tog=document.getElementById('toggle-'+id);const isOpen=body.style.display!=='none';body.style.display=isOpen?'none':'block';tog.textContent=isOpen?'▼':'▲';openCards[id]=!isOpen;}

function renderQuiz(){
  const el=document.getElementById('phase-1');
  let html=`<div class="section-intro"><h2>Phase 2 — Quiz</h2><p>Choose the sentence that follows the correct pattern.</p></div>`;
  QUIZ.forEach((q,qi)=>{
    const answered=quizAnswers[q.id]!==undefined;
    html+=`<div class="quiz-card"><div class="quiz-num">Question ${qi+1} of ${QUIZ.length}</div><div class="quiz-situation"><strong>Situation:</strong> ${q.situation}</div><div class="quiz-prompt">${q.prompt}</div><div class="quiz-options">`;
    q.options.forEach((opt,oi)=>{let cls='';if(answered){if(oi===q.correct)cls='revealed';else if(quizAnswers[q.id]===oi)cls='incorrect';}html+=`<button class="q-opt ${cls}" data-qid="${q.id}" data-oi="${oi}" onclick="answerQuiz(this)"><span class="q-letter">${String.fromCharCode(65+oi)}</span><span class="q-text">${opt}</span></button>`;});
    html+=`</div>`;
    if(answered){
      const isCorrect=quizAnswers[q.id]===q.correct;
      const msg = isCorrect ? q.correctMsg : q.incorrectMsg;
      html+=`<div class="quiz-feedback ${isCorrect?'correct':'incorrect'} show">${isCorrect?'✓ Correct! ':'✗ Not quite. '}${msg}</div>`;
    }
    html+=`</div>`;
  });
  const allDone=Object.keys(quizAnswers).length===QUIZ.length;
  const correctCount=QUIZ.filter(q=>quizAnswers[q.id]===q.correct).length;
  if(allDone){html+=`<div class="results-card" style="margin-top:.5rem"><div class="result-score">${correctCount}<span class="result-denom">/${QUIZ.length}</span></div><div style="font-size:14px;color:var(--text3);margin-top:4px">correct</div><p class="result-note">${correctCount>=4?'Excellent! These three patterns are consolidating well.':correctCount>=3?'Good work — review anything you missed, then continue.':'Review Phase 1 again, especially the comparison table.'}</p></div>`;}
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Back to Learn</button><button class="nav-btn primary" onclick="goPhase(2)" ${allDone?'':'disabled'}>Continue to Write →</button></div>`;
  el.innerHTML=html;checkPdfBtn();
}
function answerQuiz(btn){const qid=btn.dataset.qid,oi=parseInt(btn.dataset.oi);if(quizAnswers[qid]!==undefined)return;quizAnswers[qid]=oi;renderQuiz();setTimeout(()=>{const fb=document.querySelector('#phase-1 .quiz-feedback.show:last-of-type');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});},80);}

function renderWrite(){
  const el=document.getElementById('phase-2');
  let html=`<div class="section-intro"><h2>Phase 3 — Write in Context</h2><p>Use each pattern yourself. No wrong answers — just write.</p></div>`;
  WRITE_TASKS.forEach((task,ti)=>{
    const val=writeAnswers[ti]||'';const selfVal=writeSelf[ti]||'';const showSelf=val.trim().length>10;const showModel=selfVal!=='';
    html+=`<div class="write-card"><span class="write-word-tag">${task.word}</span><div class="write-reminder"><strong>Prompt:</strong> ${task.prompt}</div><div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;font-style:italic">💭 Think about: ${task.hint}</div><textarea class="write-ta ${val?'has-text':''}" id="wta-${ti}" placeholder="Write your sentence here…" oninput="recordWrite(${ti},this.value)">${escHtml(val)}</textarea><div class="self-eval ${showSelf?'show':''}" id="se-${ti}"><div class="self-eval-lbl">How confident do you feel about this sentence?</div><div class="self-btns"><button class="self-btn ${selfVal==='yes'?'picked-yes':''}" onclick="pickSelf(${ti},'yes',this)">✓ I feel good about it</button><button class="self-btn ${selfVal==='unsure'?'picked-unsure':''}" onclick="pickSelf(${ti},'unsure',this)">? Not sure</button><button class="self-btn ${selfVal==='no'?'picked-no':''}" onclick="pickSelf(${ti},'no',this)">✗ I struggled</button></div></div><button class="check-btn ${showModel?'done':''}" onclick="showModel(${ti})">${showModel?'✓ Model answer shown':'See a model answer'}</button><div class="model-answer ${showModel?'show':''}" id="ma-${ti}"><strong>Example answer:</strong> ${task.model}</div></div>`;
  });
  const cVal=capstoneText;
  html+=`<div class="write-card capstone"><span class="write-word-tag">🏆 Capstone Challenge</span><div class="write-reminder"><strong>Prompt:</strong> ${CAPSTONE.prompt}</div><div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;font-style:italic">💭 Think about: ${CAPSTONE.hint}</div><textarea class="write-ta ${cVal?'has-text':''}" id="wta-capstone" placeholder="Write your paragraph here…" oninput="capstoneText=this.value">${escHtml(cVal)}</textarea></div>`;
  const done=Object.values(writeAnswers).filter(v=>v&&v.trim().length>5).length;
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Back to Quiz</button><div style="text-align:center"><div style="font-size:13px;color:var(--text3);margin-bottom:.3rem">${done} of ${WRITE_TASKS.length} completed</div>${done>=WRITE_TASKS.length?'<div style="font-size:13px;font-weight:600;color:var(--teal)">✓ All done! Export to PDF and submit in Classroom or WhatsApp.</div>':''}</div><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>`;
  el.innerHTML=html;checkPdfBtn();
}
function recordWrite(ti,val){writeAnswers[ti]=val;const se=document.getElementById('se-'+ti);if(se)se.className='self-eval'+(val.trim().length>10?' show':'');}
function pickSelf(ti,val,btn){writeSelf[ti]=val;const btns=btn.closest('.self-btns').querySelectorAll('.self-btn');btns.forEach(b=>{b.className='self-btn';});btn.classList.add(val==='yes'?'picked-yes':val==='unsure'?'picked-unsure':'picked-no');const ma=document.getElementById('ma-'+ti);if(ma){ma.classList.add('show');document.querySelector(`#phase-2 .write-card:nth-child(${ti+2}) .check-btn`).classList.add('done');}}
function showModel(ti){const ma=document.getElementById('ma-'+ti);if(ma)ma.classList.add('show');const btns=document.querySelectorAll('#phase-2 .check-btn');if(btns[ti])btns[ti].classList.add('done');const val=writeAnswers[ti]||'';const se=document.getElementById('se-'+ti);if(se&&val.trim().length>10)se.classList.add('show');}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function checkPdfBtn(){document.getElementById('pdfBtn').classList.toggle('show',currentPhase===2);}
function exportPDF(){
  const openState={};
  document.querySelectorAll('.pc-body').forEach(b=>{openState[b.id]=b.style.display;b.style.display='block';});
  document.querySelectorAll('.pc-toggle').forEach(t=>t.textContent='▲');
  const p0=document.getElementById('phase-0'),p1=document.getElementById('phase-1'),p2=document.getElementById('phase-2');
  const d0=p0.style.display,d1=p1.style.display,d2=p2.style.display;
  p0.style.display='block';p1.style.display='block';p2.style.display='block';
  window.print();
  setTimeout(()=>{p0.style.display=d0;p1.style.display=d1;p2.style.display=d2;document.querySelectorAll('.pc-body').forEach(b=>{b.style.display=openState[b.id];});},300);
}
renderLearn();
updateProgress();
</script>
</body>
</html>
