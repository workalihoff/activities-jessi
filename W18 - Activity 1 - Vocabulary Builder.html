<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Builder — Week 18 | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --amber-bg:#FAEEDA;--amber-t:#633806;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.section-intro{text-align:center;padding:2rem 0 1.5rem}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:520px;margin:0 auto}
.phase-nav{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.word-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:1.25rem;overflow:hidden;transition:box-shadow .2s}
.word-card:hover{box-shadow:0 2px 16px rgba(0,0,0,.07)}
.wc-header{padding:1.25rem 1.5rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;cursor:pointer;user-select:none}
.wc-word{font-family:'Raleway',sans-serif;font-size:20px;font-weight:700;color:var(--teal);margin-bottom:3px}
.wc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wc-pos{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:10px;background:var(--teal-light);color:var(--teal-dark)}
.wc-toggle{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s;color:var(--text3)}
.wc-body{padding:0 1.5rem 1.5rem;border-top:1px solid var(--border)}
.wc-def-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:.9rem 0 .35rem}
.wc-def{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:.75rem}
.confusion-box{background:var(--amber-bg);border-left:3px solid #BA7517;border-radius:0 8px 8px 0;padding:.7rem 1rem;margin:.75rem 0}
.confusion-box .cb-title{font-size:11px;font-weight:700;color:var(--amber-t);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.confusion-box p{font-size:13px;color:var(--amber-t);line-height:1.55}
.example-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.25rem}
.ex-item{background:var(--cream);border-radius:8px;padding:.65rem .9rem;font-size:13px;color:var(--text2);line-height:1.5;border-left:3px solid var(--teal-mid)}
.ex-item strong{color:var(--teal-dark);font-weight:700}
.ex-context{font-size:11px;color:var(--text3);margin-top:3px}
.colloc-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:.25rem}
.colloc-chip{padding:5px 12px;border-radius:16px;font-size:12px;background:var(--teal-light);color:var(--teal-dark);font-weight:600;border:1px solid #9FE1CB}
.tip-box{background:var(--blue-bg);border-radius:8px;padding:.65rem .9rem;margin-top:.75rem;font-size:13px;color:var(--blue-t);line-height:1.5}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-situation{background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:var(--teal-dark);margin-bottom:1rem}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;transition:all .15s;font-family:'Lato',sans-serif;width:100%}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct,.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-card.capstone{border:2px solid var(--terra);background:var(--terra-light)}
.write-word-tag{display:inline-block;font-family:'Raleway',sans-serif;font-size:17px;font-weight:700;color:var(--teal);background:var(--teal-light);padding:4px 16px;border-radius:20px;margin-bottom:.75rem;border:1px solid #9FE1CB}
.capstone .write-word-tag{color:var(--terra);background:#fff;border-color:var(--terra)}
.write-reminder{background:var(--cream);border-radius:8px;padding:.6rem .9rem;font-size:12px;color:var(--text3);margin-bottom:1rem;line-height:1.5}
.capstone .write-reminder{background:#fff}
.write-reminder strong{color:var(--text2);font-weight:600}
.write-ta{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;transition:border-color .15s;line-height:1.6;background:var(--cream)}
.capstone .write-ta{min-height:120px;background:#fff}
.write-ta:focus{border-color:var(--teal-mid);background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.self-eval{margin-top:.75rem;display:none}
.self-eval.show{display:block}
.self-eval-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.4rem}
.self-btns{display:flex;gap:7px;flex-wrap:wrap}
.self-btn{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.self-btn.picked-yes{background:var(--green-bg);border-color:var(--green-b);color:var(--green-t)}
.self-btn.picked-unsure{background:var(--amber-bg);border-color:#BA7517;color:var(--amber-t)}
.self-btn.picked-no{background:var(--red-bg);border-color:#E24B4A;color:var(--red-t)}
.check-btn{margin-top:.75rem;padding:.5rem 1.1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.check-btn.done{background:var(--teal-light);border-color:var(--teal-mid);color:var(--teal-dark)}
.model-answer{margin-top:.75rem;padding:.65rem .9rem;background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;font-size:13px;color:var(--teal-dark);line-height:1.55;display:none}
.model-answer.show{display:block}
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.25rem}
.result-score{font-family:'Raleway',sans-serif;font-size:54px;font-weight:700;color:var(--teal);line-height:1}
.result-denom{font-size:20px;color:var(--text3)}
.result-note{font-size:14px;color:var(--text2);max-width:420px;margin:.75rem auto 0;line-height:1.6}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.pdf-btn{position:fixed;bottom:22px;right:22px;background:var(--teal);color:#fff;border:none;border-radius:30px;padding:.8rem 1.4rem;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(15,110,86,.35);display:none;align-items:center;gap:8px;z-index:60}
.pdf-btn.show{display:flex}
.pdf-btn:hover{background:var(--teal-mid)}
@media print{
  .topbar,.phase-nav,.pdf-btn,.bottom-nav,.check-btn,.self-btns{display:none !important}
  #phase-0,#phase-1,#phase-2{display:block !important}
  .word-card,.quiz-card,.write-card{break-inside:avoid;margin-bottom:1rem}
  body{background:#fff}
}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}.wc-word{font-size:17px}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">Vocabulary Builder — Week 18</div><div class="topbar-sub">English with Ali · Getting to the Point</div></div>
  <div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:0%"></div></div><span class="prog-label" id="prog-label">Phase 1 of 3</span></div>
</div>
<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Learn</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Quiz</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>
<button class="pdf-btn" id="pdfBtn" onclick="exportPDF()">📄 Export to PDF</button>

<script>
// A short, lighter-load activity — 5 phrases instead of the usual 6.
const WORDS = [
  {id:'inshort',word:'In short',pos:'discourse marker',
    meanings:[{sense:'Signaling a quick summary',
      def:'Used to give the short version of something you already explained, or to jump straight to the main point.',
      examples:[
        {text:'<strong>In short</strong>, the deadline moved up and Vinicio needs the file today.',context:'Summarizing a longer update quickly.'},
        {text:'<strong>In short</strong>, everything is on track.',context:'Giving a one-line status.'},
      ],
      collocations:['in short, [main point]']}],
    confusion:'⚠️  "In short" goes at the START of the summary sentence, not the end.',
    tip:'💡  Use this when you catch yourself about to over-explain — it forces you to say the main point first.',
    writePrompts:['Write a sentence using "in short" to summarize a work situation.']},

  {id:'summarize',word:'To summarize',pos:'discourse marker',
    meanings:[{sense:'Signaling you\'re about to wrap up the main points',
      def:'A more formal way to signal you\'re moving from detail into a short recap — common in meetings and presentations.',
      examples:[
        {text:'<strong>To summarize</strong>, we have three activities and one urgent deadline.',context:'Closing out a briefing.'},
        {text:'<strong>To summarize</strong> what Andrea told me: the requirement is mandatory for every vendor.',context:'Wrapping up something you heard.'},
      ],
      collocations:['to summarize, [main points]']}],
    confusion:'⚠️  More formal than "in short" — good for briefings and emails, less natural in casual chat.',
    tip:'💡  Good opener for the LAST sentence of an update, spoken or written.',
    writePrompts:['Write a sentence using "to summarize" to close out a work update.']},

  {id:'bottomline',word:'The bottom line is',pos:'expression',
    meanings:[{sense:'Signaling the most important conclusion',
      def:'Used to cut through a lot of detail and say what actually matters most — the real takeaway.',
      examples:[
        {text:'<strong>The bottom line is</strong>, we need Vinicio\'s numbers by tomorrow.',context:'Cutting to what really matters.'},
        {text:'There are a few factors, but <strong>the bottom line is</strong> the deadline can\'t move.',context:'After listing details, landing on the key point.'},
      ],
      collocations:['the bottom line is, [key point]']}],
    confusion:'⚠️  Stronger and more direct than "in short" — use it when you want to signal "this is what actually matters, forget the rest."',
    tip:'💡  Picture the last line of a financial report — the number that matters most. That\'s the "bottom line."',
    writePrompts:['Write a sentence using "the bottom line is" to state what really matters in a situation.']},

  {id:'longstory',word:'Long story short',pos:'expression',
    meanings:[{sense:'Skipping details to give the outcome, informally',
      def:'A casual way to signal you\'re skipping the details and jumping to what happened or what matters.',
      examples:[
        {text:'<strong>Long story short</strong>, the deadline moved and we adjusted.',context:'Skipping a complicated explanation.'},
        {text:'<strong>Long story short</strong>, everything worked out.',context:'Casual wrap-up after a complicated week.'},
      ],
      collocations:['long story short, [outcome]']}],
    confusion:'⚠️  More casual than "in short" or "to summarize" — great for spoken conversation, a bit too informal for a formal email to a client.',
    tip:'💡  Perfect for exactly the moment you catch yourself getting lost in details — a verbal reset button.',
    writePrompts:['Write a sentence using "long story short" about something at work.']},

  {id:'putsimply',word:'Put simply',pos:'discourse marker',
    meanings:[{sense:'Signaling a simpler restatement of something complex',
      def:'Used right before you restate something complicated in easier words — great for explaining something technical.',
      examples:[
        {text:'<strong>Put simply</strong>, we need one more signature before we can move forward.',context:'Simplifying a multi-step process.'},
        {text:'<strong>Put simply</strong>, the new rule applies to every vendor, no exceptions.',context:'Cutting through complexity.'},
      ],
      collocations:['put simply, [simpler version]']}],
    confusion:'⚠️  Different job than "in short" — "put simply" is about simplifying complexity, not just shortening length.',
    tip:'💡  Use this right before you explain something technical to someone outside your team.',
    writePrompts:['Write a sentence using "put simply" to explain something complex in easier words.']},
];

const QUIZ = [
  {id:'q1',situation:'You just explained a complicated situation to Ricardo in a lot of detail, and now you want to land on the one thing that matters most.',
    prompt:'Which phrase fits best?',
    options:['In short','The bottom line is','Long story short','Put simply'],
    correct:1,
    correctMsg:'"The bottom line is" is exactly for cutting through detail to the one thing that matters most — stronger than a simple summary.',
    incorrectMsg:'The best fit here is "the bottom line is" — it signals the single most important point, not just a shorter version.'},
  {id:'q2',situation:'You\'re writing a formal email update to your manager and want to close with a clear recap of the main points.',
    prompt:'Which phrase fits best in this formal, written context?',
    options:['Long story short','To summarize','Put simply','In short'],
    correct:1,
    correctMsg:'"To summarize" is the most formal option here — a natural fit for closing a written update.',
    incorrectMsg:'"To summarize" is the more formal choice — better suited to a written update than the more casual options.'},
  {id:'q3',situation:'A colleague asks what happened with a complicated situation, and you want to skip the details and just tell them casually what happened.',
    prompt:'Which phrase fits best?',
    options:['To summarize','The bottom line is','Long story short','Put simply'],
    correct:2,
    correctMsg:'"Long story short" is the casual, spoken option for skipping details and going straight to the outcome.',
    incorrectMsg:'"Long story short" is the natural casual choice here — the others are either more formal or focused on the "most important point" rather than the outcome.'},
  {id:'q4',situation:'You need to explain a technical process to someone from a different department who won\'t understand the jargon.',
    prompt:'Which phrase fits best right before your simpler explanation?',
    options:['In short','Put simply','Long story short','The bottom line is'],
    correct:1,
    correctMsg:'"Put simply" is specifically for simplifying something complex, not just shortening it — perfect for explaining across departments.',
    incorrectMsg:'"Put simply" is the best fit for simplifying complexity for a non-expert — the others are more about length or importance than simplicity.'},
  {id:'q5',situation:'You want a short, neutral way to jump straight to your main point after a longer explanation, in a normal work conversation.',
    prompt:'Which phrase fits best?',
    options:['In short','Long story short','Put simply','To summarize'],
    correct:0,
    correctMsg:'"In short" is the flexible, neutral default — works in most everyday work conversations.',
    incorrectMsg:'"In short" is the more neutral, everyday choice here — the others are either more casual, more formal, or focused on simplifying complexity specifically.'},
];

const WRITE_TASKS = [
  {word:'in short',prompt:'Write a sentence using "in short" to summarize a work situation.',hint:'Think of a longer story you could compress into one line.',model:'In short, the deadline moved up and we adjusted the plan.'},
  {word:'to summarize',prompt:'Write a sentence using "to summarize" to close out a work update.',hint:'Imagine ending an email or a briefing.',model:'To summarize, all three activities are on track except one, which needs Andrea\'s sign-off.'},
  {word:'the bottom line is',prompt:'Write a sentence using "the bottom line is" to state what really matters.',hint:'What\'s the one thing someone needs to know, even if they forget everything else?',model:'The bottom line is, we can\'t move forward without Priya\'s confirmation.'},
  {word:'long story short',prompt:'Write a sentence using "long story short" about something at work.',hint:'Think of something a little complicated that you could compress casually.',model:'Long story short, the vendor was late, but everything got resolved by Friday.'},
  {word:'put simply',prompt:'Write a sentence using "put simply" to explain something complex in easier words.',hint:'Think of something technical you\'d need to explain to someone outside your team.',model:'Put simply, every vendor now needs one extra signature before we can process their file.'},
];

const CAPSTONE = {prompt:'Write a short paragraph (3–5 sentences) practicing getting to the point — imagine summarizing a busy week at work. Use at least 3 of this week\'s phrases.',hint:'Try writing the long version first in your head, then compress it using these phrases.'};

let currentPhase = 0;
const quizAnswers = {};
const writeAnswers = {};
const writeSelf = {};
let capstoneText = '';
let openCards = {};

function updateProgress(){
  const phases=['Phase 1 of 3 — Learn','Phase 2 of 3 — Quiz','Phase 3 of 3 — Write'];
  const pcts=[33,66,100];
  document.getElementById('prog').style.width=pcts[currentPhase]+'%';
  document.getElementById('prog-label').textContent=phases[currentPhase];
}
function goPhase(n){
  document.getElementById('phase-'+currentPhase).style.display='none';
  document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  currentPhase=n;
  document.getElementById('phase-'+n).style.display='block';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  if(n===1) renderQuiz();
  if(n===2) renderWrite();
}
function renderLearn(){
  const el=document.getElementById('phase-0');
  let html=`<div class="section-intro"><h2>Phase 1 — Learn the Phrases</h2><p>Five phrases for getting to the point — useful for exactly the moments where a story gets long. Tap a card to expand it.</p></div>`;
  WORDS.forEach(w=>{
    const isOpen=openCards[w.id]!==false;
    html+=`<div class="word-card" id="wcard-${w.id}"><div class="wc-header" onclick="toggleCard('${w.id}')"><div><div class="wc-word">${w.word}</div><div class="wc-meta"><span class="wc-pos">${w.pos}</span></div></div><div class="wc-toggle" id="toggle-${w.id}">${isOpen?'▲':'▼'}</div></div><div class="wc-body" id="wbody-${w.id}" style="display:${isOpen?'block':'none'}">`;
    w.meanings.forEach(m=>{
      html+=`<div class="wc-def-label">Definition</div><div class="wc-def">${m.def}</div><div class="wc-def-label">Examples in context</div><div class="example-list">`;
      m.examples.forEach(ex=>{html+=`<div class="ex-item">${ex.text}<div class="ex-context">📍 ${ex.context}</div></div>`;});
      html+=`</div><div class="wc-def-label">Pattern</div><div class="colloc-row">`;
      m.collocations.forEach(c=>{html+=`<span class="colloc-chip">${c}</span>`;});
      html+=`</div>`;
    });
    if(w.confusion) html+=`<div class="confusion-box"><div class="cb-title">⚠️ Don't confuse this</div><p>${w.confusion}</p></div>`;
    if(w.tip) html+=`<div class="tip-box">${w.tip}</div>`;
    html+=`</div></div>`;
  });
  html+=`<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">${WORDS.length} phrases covered</span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Quiz →</button></div>`;
  el.innerHTML=html;
  checkPdfBtn();
}
function toggleCard(id){
  const body=document.getElementById('wbody-'+id),tog=document.getElementById('toggle-'+id);
  const isOpen=body.style.display!=='none';
  body.style.display=isOpen?'none':'block';tog.textContent=isOpen?'▼':'▲';openCards[id]=!isOpen;
}
function renderQuiz(){
  const el=document.getElementById('phase-1');
  let html=`<div class="section-intro"><h2>Phase 2 — Quiz</h2><p>Read each situation and choose the phrase that fits best.</p></div>`;
  QUIZ.forEach((q,qi)=>{
    const answered=quizAnswers[q.id]!==undefined;
    html+=`<div class="quiz-card"><div class="quiz-num">Question ${qi+1} of ${QUIZ.length}</div><div class="quiz-situation"><strong>Situation:</strong> ${q.situation}</div><div class="quiz-prompt">${q.prompt}</div><div class="quiz-options">`;
    q.options.forEach((opt,oi)=>{
      let cls='';
      if(answered){if(oi===q.correct)cls='revealed';else if(quizAnswers[q.id]===oi)cls='incorrect';}
      html+=`<button class="q-opt ${cls}" data-qid="${q.id}" data-oi="${oi}" onclick="answerQuiz(this)"><span class="q-letter">${String.fromCharCode(65+oi)}</span><span class="q-text">${opt}</span></button>`;
    });
    html+=`</div>`;
    if(answered){
      // Bug fix (flagged after W17 review): feedback text now genuinely depends on whether the
      // selected answer was correct, not just the icon. Correct and incorrect each get their own message.
      const isCorrect=quizAnswers[q.id]===q.correct;
      const msg = isCorrect ? q.correctMsg : q.incorrectMsg;
      html+=`<div class="quiz-feedback ${isCorrect?'correct':'incorrect'} show">${isCorrect?'✓ Correct! ':'✗ Not quite. '}${msg}</div>`;
    }
    html+=`</div>`;
  });
  const allDone=Object.keys(quizAnswers).length===QUIZ.length;
  const correctCount=QUIZ.filter(q=>quizAnswers[q.id]===q.correct).length;
  if(allDone){
    html+=`<div class="results-card" style="margin-top:.5rem"><div class="result-score">${correctCount}<span class="result-denom">/${QUIZ.length}</span></div><div style="font-size:14px;color:var(--text3);margin-top:4px">correct</div><p class="result-note">${correctCount>=4?'Excellent! You\'re distinguishing between these phrases well. Move on to writing.':correctCount>=3?'Good work — review the ones you missed in Phase 1, then continue.':'Review Phase 1 again, focusing on how formal or casual each phrase is.'}</p></div>`;
  }
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Back to Learn</button><button class="nav-btn primary" onclick="goPhase(2)" ${allDone?'':'disabled'}>Continue to Write →</button></div>`;
  el.innerHTML=html;
  checkPdfBtn();
}
function answerQuiz(btn){
  const qid=btn.dataset.qid,oi=parseInt(btn.dataset.oi);
  if(quizAnswers[qid]!==undefined)return;
  quizAnswers[qid]=oi;renderQuiz();
  setTimeout(()=>{const fb=document.querySelector('#phase-1 .quiz-feedback.show:last-of-type');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}
function renderWrite(){
  const el=document.getElementById('phase-2');
  let html=`<div class="section-intro"><h2>Phase 3 — Write in Context</h2><p>Use the phrases yourself. No wrong answers — just write.</p></div>`;
  WRITE_TASKS.forEach((task,ti)=>{
    const val=writeAnswers[ti]||'';const selfVal=writeSelf[ti]||'';
    const showSelf=val.trim().length>10;const showModel=selfVal!=='';
    html+=`<div class="write-card"><span class="write-word-tag">${task.word}</span><div class="write-reminder"><strong>Prompt:</strong> ${task.prompt}</div>${task.hint?`<div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;font-style:italic">💭 Think about: ${task.hint}</div>`:''}<textarea class="write-ta ${val?'has-text':''}" id="wta-${ti}" placeholder="Write your sentence here…" oninput="recordWrite(${ti},this.value)">${escHtml(val)}</textarea><div class="self-eval ${showSelf?'show':''}" id="se-${ti}"><div class="self-eval-lbl">How confident do you feel about this sentence?</div><div class="self-btns"><button class="self-btn ${selfVal==='yes'?'picked-yes':''}" onclick="pickSelf(${ti},'yes',this)">✓ I feel good about it</button><button class="self-btn ${selfVal==='unsure'?'picked-unsure':''}" onclick="pickSelf(${ti},'unsure',this)">? Not sure</button><button class="self-btn ${selfVal==='no'?'picked-no':''}" onclick="pickSelf(${ti},'no',this)">✗ I struggled</button></div></div><button class="check-btn ${showModel?'done':''}" onclick="showModel(${ti})">${showModel?'✓ Model answer shown':'See a model answer'}</button><div class="model-answer ${showModel?'show':''}" id="ma-${ti}"><strong>Example answer:</strong> ${task.model}</div></div>`;
  });
  const cVal=capstoneText;
  html+=`<div class="write-card capstone"><span class="write-word-tag">🏆 Capstone Challenge</span><div class="write-reminder"><strong>Prompt:</strong> ${CAPSTONE.prompt}</div><div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;font-style:italic">💭 Think about: ${CAPSTONE.hint}</div><textarea class="write-ta ${cVal?'has-text':''}" id="wta-capstone" placeholder="Write your paragraph here…" oninput="capstoneText=this.value">${escHtml(cVal)}</textarea></div>`;
  const done=Object.values(writeAnswers).filter(v=>v&&v.trim().length>5).length;
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Back to Quiz</button><div style="text-align:center"><div style="font-size:13px;color:var(--text3);margin-bottom:.3rem">${done} of ${WRITE_TASKS.length} completed</div>${done>=WRITE_TASKS.length?'<div style="font-size:13px;font-weight:600;color:var(--teal)">✓ All done! Export to PDF and submit in Classroom or WhatsApp.</div>':''}</div><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>`;
  el.innerHTML=html;
  checkPdfBtn();
}
function recordWrite(ti,val){writeAnswers[ti]=val;const se=document.getElementById('se-'+ti);if(se)se.className='self-eval'+(val.trim().length>10?' show':'');}
function pickSelf(ti,val,btn){writeSelf[ti]=val;const btns=btn.closest('.self-btns').querySelectorAll('.self-btn');btns.forEach(b=>{b.className='self-btn';});btn.classList.add(val==='yes'?'picked-yes':val==='unsure'?'picked-unsure':'picked-no');const ma=document.getElementById('ma-'+ti);if(ma){ma.classList.add('show');document.querySelector(`#phase-2 .write-card:nth-child(${ti+2}) .check-btn`).classList.add('done');}}
function showModel(ti){const ma=document.getElementById('ma-'+ti);if(ma)ma.classList.add('show');const btns=document.querySelectorAll('#phase-2 .check-btn');if(btns[ti])btns[ti].classList.add('done');const val=writeAnswers[ti]||'';const se=document.getElementById('se-'+ti);if(se&&val.trim().length>10)se.classList.add('show');}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function checkPdfBtn(){document.getElementById('pdfBtn').classList.toggle('show',currentPhase===2);}
function exportPDF(){
  const openState={};
  document.querySelectorAll('.wc-body').forEach(b=>{openState[b.id]=b.style.display;b.style.display='block';});
  document.querySelectorAll('.wc-toggle').forEach(t=>t.textContent='▲');
  const p0=document.getElementById('phase-0'),p1=document.getElementById('phase-1'),p2=document.getElementById('phase-2');
  const d0=p0.style.display,d1=p1.style.display,d2=p2.style.display;
  p0.style.display='block';p1.style.display='block';p2.style.display='block';
  window.print();
  setTimeout(()=>{
    p0.style.display=d0;p1.style.display=d1;p2.style.display=d2;
    document.querySelectorAll('.wc-body').forEach(b=>{b.style.display=openState[b.id];});
  },300);
}
renderLearn();
updateProgress();
</script>
</body>
</html>
