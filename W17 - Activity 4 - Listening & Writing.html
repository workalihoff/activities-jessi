<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen + Write — Week 16 | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.section-intro{text-align:center;padding:2rem 0 1.5rem}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:540px;margin:0 auto}
.phase-nav{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}

.audio-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.6rem 1.8rem;margin-bottom:1.25rem}
.audio-tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--teal-light);color:var(--teal-dark);padding:3px 10px;border-radius:8px;margin-bottom:.7rem}
.audio-title{font-family:'Raleway',sans-serif;font-size:20px;font-weight:700;color:var(--text);margin-bottom:.4rem}
.audio-meta{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.speaker-chip{display:flex;align-items:center;gap:6px;background:var(--cream);border-radius:20px;padding:4px 12px;font-size:12.5px;color:var(--text2);font-weight:600}
.audio-link{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;text-decoration:none;padding:.7rem 1.3rem;border-radius:10px;font-weight:700;font-size:14px;margin-top:.5rem}
.audio-link:hover{background:var(--teal-mid)}
.pass-block{background:var(--cream);border-radius:12px;padding:1.1rem 1.3rem;margin-top:1.1rem}
.pass-block .pb-title{font-family:'Raleway',sans-serif;font-weight:700;font-size:14px;color:var(--teal-dark);margin-bottom:.4rem}
.pass-block p{font-size:13.5px;color:var(--text2);line-height:1.6;margin:0}
.glossary{background:var(--blue-bg);border-radius:10px;padding:1rem 1.2rem;margin-top:1rem}
.glossary-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--blue-t);margin-bottom:.6rem}
.gloss-item{font-size:13px;color:var(--blue-t);line-height:1.6;margin-bottom:.35rem}
.gloss-item strong{font-weight:700}

.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-pass-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 9px;border-radius:8px;margin-left:8px}
.badge-gist{background:var(--amber-bg,#FAEEDA);color:#633806}
.badge-detail{background:var(--teal-light);color:var(--teal-dark)}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;transition:all .15s;font-family:'Lato',sans-serif;width:100%}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct,.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.paraphrase-card{background:var(--card);border:2px solid var(--terra);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.paraphrase-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:var(--terra);margin-bottom:.6rem}
.paraphrase-ta{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;background:var(--cream)}
.paraphrase-ta:focus{border-color:var(--teal-mid);background:#fff}
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.25rem}
.result-score{font-family:'Raleway',sans-serif;font-size:54px;font-weight:700;color:var(--teal);line-height:1}
.result-denom{font-size:20px;color:var(--text3)}
.result-note{font-size:14px;color:var(--text2);max-width:420px;margin:.75rem auto 0;line-height:1.6}

.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-word-tag{display:inline-block;font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:var(--teal);background:var(--teal-light);padding:4px 16px;border-radius:20px;margin-bottom:.75rem;border:1px solid #9FE1CB}
.write-reminder{background:var(--cream);border-radius:8px;padding:.6rem .9rem;font-size:12px;color:var(--text3);margin-bottom:1rem;line-height:1.5}
.write-reminder strong{color:var(--text2);font-weight:600}
.write-ta{width:100%;min-height:110px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;transition:border-color .15s;line-height:1.6;background:var(--cream)}
.write-ta:focus{border-color:var(--teal-mid);background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.self-eval{margin-top:.75rem;display:none}
.self-eval.show{display:block}
.self-eval-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.4rem}
.self-btns{display:flex;gap:7px;flex-wrap:wrap}
.self-btn{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.self-btn.picked-yes{background:var(--green-bg);border-color:var(--green-b);color:var(--green-t)}
.self-btn.picked-unsure{background:var(--amber-bg,#FAEEDA);border-color:#BA7517;color:#633806}
.self-btn.picked-no{background:var(--red-bg);border-color:#E24B4A;color:var(--red-t)}
.check-btn{margin-top:.75rem;padding:.5rem 1.1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.check-btn.done{background:var(--teal-light);border-color:var(--teal-mid);color:var(--teal-dark)}
.model-answer{margin-top:.75rem;padding:.65rem .9rem;background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;font-size:13px;color:var(--teal-dark);line-height:1.55;display:none}
.model-answer.show{display:block}

.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.pdf-btn{position:fixed;bottom:22px;right:22px;background:var(--teal);color:#fff;border:none;border-radius:30px;padding:.8rem 1.4rem;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(15,110,86,.35);display:none;align-items:center;gap:8px;z-index:60}
.pdf-btn.show{display:flex}
.pdf-btn:hover{background:var(--teal-mid)}
@media print{
  .topbar,.phase-nav,.pdf-btn,.bottom-nav,.check-btn,.self-btns{display:none !important}
  #phase-0,#phase-1,#phase-2{display:block !important}
  .audio-card,.quiz-card,.write-card,.paraphrase-card{break-inside:avoid;margin-bottom:1rem}
  body{background:#fff}
}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}.audio-title{font-size:17px}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">Listen + Write — Week 16</div><div class="topbar-sub">English with Ali · The Music Industry</div></div>
  <div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:0%"></div></div><span class="prog-label" id="prog-label">Phase 1 of 3</span></div>
</div>
<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Listen</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Comprehension</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>
<button class="pdf-btn" id="pdfBtn" onclick="exportPDF()">📄 Export to PDF</button>

<script>
const GLOSSARY = [
  {term:'to make it',def:'to become successful (e.g., "to make it in the music industry")'},
  {term:'to go viral',def:'when a video or post is suddenly seen and shared by huge numbers of people online'},
  {term:'to catch a break',def:'to get a lucky opportunity that helps you succeed'},
];

let currentPhase=0;const quizAnswers={};const writeAnswers={};const writeSelf={};let paraphraseText='';

function updateProgress(){const phases=['Phase 1 of 3 — Listen','Phase 2 of 3 — Comprehension','Phase 3 of 3 — Write'];const pcts=[33,66,100];document.getElementById('prog').style.width=pcts[currentPhase]+'%';document.getElementById('prog-label').textContent=phases[currentPhase];}
function goPhase(n){document.getElementById('phase-'+currentPhase).style.display='none';document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===n));currentPhase=n;document.getElementById('phase-'+n).style.display='block';updateProgress();window.scrollTo({top:0,behavior:'smooth'});if(n===1)renderQuiz();if(n===2)renderWrite();}

function renderListen(){
  const el=document.getElementById('phase-0');
  let html=`<div class="section-intro"><h2>Phase 1 — Listen</h2><p>This week's speakers have different accents than usual — Hana (Japan) and Ben (US) — good practice for real international calls.</p></div>`;
  html+=`<div class="audio-card"><span class="audio-tag">ELLLO Views #1490 · B1</span><div class="audio-title">The Music Industry</div><div class="audio-meta"><span class="speaker-chip">🇯🇵 Hana</span><span class="speaker-chip">🇺🇸 Ben</span><span class="speaker-chip">⏱ 5:08</span></div><p style="font-size:14px;color:var(--text2);line-height:1.6">Ben talks about how hard it is to make it in the music industry, and how the internet has changed the game for new artists.</p><a class="audio-link" href="https://elllo.org/english/1451/1490-Ben-Hanna-Music-Business.htm" target="_blank" rel="noopener">▶ Listen on ELLLO</a>`;
  html+=`<div class="pass-block"><div class="pb-title">🎧 First pass — Gist</div><p>Listen once, all the way through, without pausing or rewinding. Don't worry about every word. Just answer: what is Ben mainly talking about?</p></div>`;
  html+=`<div class="pass-block"><div class="pb-title">🎧 Second pass — Detail</div><p>Listen again. This time you can pause and rewind freely. Focus on the specific example Ben and Hana talk about, and how someone can become famous through it.</p></div>`;
  html+=`<div class="glossary"><div class="glossary-title">💡 Before you listen — 3 expressions</div>`;
  GLOSSARY.forEach(g=>{html+=`<div class="gloss-item"><strong>${g.term}</strong> — ${g.def}</div>`;});
  html+=`</div></div>`;
  html+=`<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">2 listening passes</span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Comprehension →</button></div>`;
  el.innerHTML=html;checkPdfBtn();
}

const QUIZ = [
  {id:'q1',pass:'gist',prompt:'What is the conversation mainly about?',
    options:['How streaming services pay musicians','How the internet has changed the way musicians become famous','Ben\'s favorite music genres','The history of the music industry'],
    correct:1,explain:'Correct! The main topic is how the internet — specifically video platforms — has changed the path to becoming a famous musician.'},
  {id:'q2',pass:'detail',prompt:'According to Ben, how can an unknown artist become famous today?',
    options:['By signing with a major record label first','By posting a video online that becomes popular','By touring in many countries first','By working with a famous producer'],
    correct:1,explain:'Correct! Ben describes artists who started with just a video that "went viral" — no label needed at first.'},
  {id:'q3',pass:'detail',prompt:'What example does Hana bring up?',
    options:['Ed Sheeran','Justin Bieber','Bruno Mars','Adele'],
    correct:1,explain:'Correct! Hana mentions Justin Bieber as an example of someone discovered this way.'},
  {id:'q4',pass:'detail',prompt:'Who posted the early videos that helped this artist get noticed, according to Ben?',
    options:['A record label','His manager','His parents','He posted them himself'],
    correct:2,explain:'Correct! Ben mentions that the artist\'s parents were the ones who posted the videos when he was a kid.'},
  {id:'q5',pass:'detail',prompt:'How does Ben describe what someone can become through this path?',
    options:['An influencer','A pop star','A record label owner','A music teacher'],
    correct:1,explain:'Correct! Ben and Hana agree: "in that way you can become a pop star" — just from posting a video that gets seen.'},
];

function renderQuiz(){
  const el=document.getElementById('phase-1');
  let html=`<div class="section-intro"><h2>Phase 2 — Comprehension</h2><p>Mixed gist and detail questions. Listen again if you need to.</p></div>`;
  QUIZ.forEach((q,qi)=>{
    const answered=quizAnswers[q.id]!==undefined;
    const badge=q.pass==='gist'?'<span class="quiz-pass-badge badge-gist">Gist</span>':'<span class="quiz-pass-badge badge-detail">Detail</span>';
    html+=`<div class="quiz-card"><div class="quiz-num">Question ${qi+1} of ${QUIZ.length}${badge}</div><div class="quiz-prompt">${q.prompt}</div><div class="quiz-options">`;
    q.options.forEach((opt,oi)=>{let cls='';if(answered){if(oi===q.correct)cls='revealed';else if(quizAnswers[q.id]===oi)cls='incorrect';}html+=`<button class="q-opt ${cls}" data-qid="${q.id}" data-oi="${oi}" onclick="answerQuiz(this)"><span class="q-letter">${String.fromCharCode(65+oi)}</span><span class="q-text">${opt}</span></button>`;});
    html+=`</div>`;
    if(answered){const correct=quizAnswers[q.id]===q.correct;html+=`<div class="quiz-feedback ${correct?'correct':'incorrect'} show">${correct?'✓ ':'✗ '}${q.explain}</div>`;}
    html+=`</div>`;
  });
  const allDone=Object.keys(quizAnswers).length===QUIZ.length;
  if(allDone){
    html+=`<div class="paraphrase-card"><div class="paraphrase-title">🗣️ Paraphrase Checkpoint</div><p style="font-size:13.5px;color:var(--text2);margin-bottom:.7rem">In 1–2 sentences, explain in your OWN words how Ben says someone can become a famous musician today. Don't copy phrases from the audio — really paraphrase it.</p><textarea class="paraphrase-ta" placeholder="In my own words…" oninput="paraphraseText=this.value">${escHtml(paraphraseText)}</textarea></div>`;
    const correctCount=QUIZ.filter(q=>quizAnswers[q.id]===q.correct).length;
    html+=`<div class="results-card"><div class="result-score">${correctCount}<span class="result-denom">/${QUIZ.length}</span></div><div style="font-size:14px;color:var(--text3);margin-top:4px">correct</div><p class="result-note">${correctCount>=4?'Great listening work — including a new accent pairing. Ready for the writing task.':'Give it one more listen before moving to the writing task.'}</p></div>`;
  }
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Back to Listen</button><button class="nav-btn primary" onclick="goPhase(2)" ${allDone?'':'disabled'}>Continue to Write →</button></div>`;
  el.innerHTML=html;checkPdfBtn();
}
function answerQuiz(btn){const qid=btn.dataset.qid,oi=parseInt(btn.dataset.oi);if(quizAnswers[qid]!==undefined)return;quizAnswers[qid]=oi;renderQuiz();setTimeout(()=>{const fb=document.querySelector('#phase-1 .quiz-feedback.show:last-of-type');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});},80);}

const WRITE_TASKS = [
  {word:'Reported Speech',prompt:'Write 4–5 sentences summarizing what Ben said about how musicians become famous today. Use reported speech ("Ben said that…", "Ben explained that…") with correct backshift.',hint:'Remember: "can" → "could," present simple → past simple, when you report what someone said.',model:'Ben said that the internet had changed the music industry. He explained that unknown artists could become famous just by posting a video that went viral. He mentioned that one artist had started this way as a kid, when his parents posted his videos online.'},
  {word:'Your Opinion',prompt:'Write 2–3 sentences: do you think this is a good way for new artists to become famous? Why or why not?',hint:'No right answer here — just practice giving an opinion clearly.',model:'I think it gives more people a chance, since you don\'t need a record label to be discovered. However, it also means a lot of luck is involved, not just talent.'},
];

function renderWrite(){
  const el=document.getElementById('phase-2');
  let html=`<div class="section-intro"><h2>Phase 3 — Write</h2><p>Use what you heard. Focus especially on reported speech backshift.</p></div>`;
  WRITE_TASKS.forEach((task,ti)=>{
    const val=writeAnswers[ti]||'';const selfVal=writeSelf[ti]||'';const showSelf=val.trim().length>10;const showModel=selfVal!=='';
    html+=`<div class="write-card"><span class="write-word-tag">${task.word}</span><div class="write-reminder"><strong>Prompt:</strong> ${task.prompt}</div><div style="font-size:12px;color:var(--text3);margin-bottom:.75rem;font-style:italic">💭 Think about: ${task.hint}</div><textarea class="write-ta ${val?'has-text':''}" id="wta-${ti}" placeholder="Write here…" oninput="recordWrite(${ti},this.value)">${escHtml(val)}</textarea><div class="self-eval ${showSelf?'show':''}" id="se-${ti}"><div class="self-eval-lbl">How confident do you feel about this?</div><div class="self-btns"><button class="self-btn ${selfVal==='yes'?'picked-yes':''}" onclick="pickSelf(${ti},'yes',this)">✓ I feel good about it</button><button class="self-btn ${selfVal==='unsure'?'picked-unsure':''}" onclick="pickSelf(${ti},'unsure',this)">? Not sure</button><button class="self-btn ${selfVal==='no'?'picked-no':''}" onclick="pickSelf(${ti},'no',this)">✗ I struggled</button></div></div><button class="check-btn ${showModel?'done':''}" onclick="showModel(${ti})">${showModel?'✓ Model answer shown':'See a model answer'}</button><div class="model-answer ${showModel?'show':''}" id="ma-${ti}"><strong>Example answer:</strong> ${task.model}</div></div>`;
  });
  const done=Object.values(writeAnswers).filter(v=>v&&v.trim().length>5).length;
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Back to Comprehension</button><div style="text-align:center"><div style="font-size:13px;color:var(--text3);margin-bottom:.3rem">${done} of ${WRITE_TASKS.length} completed</div>${done>=WRITE_TASKS.length?'<div style="font-size:13px;font-weight:600;color:var(--teal)">✓ All done! Export to PDF and submit in Classroom or WhatsApp.</div>':''}</div><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>`;
  el.innerHTML=html;checkPdfBtn();
}
function recordWrite(ti,val){writeAnswers[ti]=val;const se=document.getElementById('se-'+ti);if(se)se.className='self-eval'+(val.trim().length>10?' show':'');}
function pickSelf(ti,val,btn){writeSelf[ti]=val;const btns=btn.closest('.self-btns').querySelectorAll('.self-btn');btns.forEach(b=>{b.className='self-btn';});btn.classList.add(val==='yes'?'picked-yes':val==='unsure'?'picked-unsure':'picked-no');const ma=document.getElementById('ma-'+ti);if(ma){ma.classList.add('show');document.querySelector(`#phase-2 .write-card:nth-child(${ti+1}) .check-btn`).classList.add('done');}}
function showModel(ti){const ma=document.getElementById('ma-'+ti);if(ma)ma.classList.add('show');const btns=document.querySelectorAll('#phase-2 .check-btn');if(btns[ti])btns[ti].classList.add('done');const val=writeAnswers[ti]||'';const se=document.getElementById('se-'+ti);if(se&&val.trim().length>10)se.classList.add('show');}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function checkPdfBtn(){document.getElementById('pdfBtn').classList.toggle('show',currentPhase===2);}
function exportPDF(){
  const p0=document.getElementById('phase-0'),p1=document.getElementById('phase-1'),p2=document.getElementById('phase-2');
  const d0=p0.style.display,d1=p1.style.display,d2=p2.style.display;
  p0.style.display='block';p1.style.display='block';p2.style.display='block';
  window.print();
  setTimeout(()=>{p0.style.display=d0;p1.style.display=d1;p2.style.display=d2;},300);
}
renderListen();
updateProgress();
</script>
