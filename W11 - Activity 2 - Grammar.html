<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Builder — Week 11: Present Perfect | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --amber-bg:#FAEEDA;--amber-t:#633806;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.info-bar{background:#fff;border-bottom:1px solid var(--border);padding:.7rem 1.5rem;display:flex;align-items:center;gap:10px;justify-content:center}
.info-bar label{font-size:12.5px;color:var(--text3);font-weight:600}
.info-bar input{border:1px solid var(--border);border-radius:8px;padding:.35rem .7rem;font-size:13px;font-family:'Lato',sans-serif;width:200px}
.info-bar input:focus{outline:none;border-color:var(--teal-mid)}
.print-header{display:none}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.section-intro{text-align:center;padding:1.5rem 0}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:520px;margin:0 auto}
.phase-nav{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1.5rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.rule-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:1.25rem;padding:1.5rem}
.rule-title{font-family:'Raleway',sans-serif;font-size:19px;font-weight:700;color:var(--teal);margin-bottom:.6rem}
.rule-def{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:.9rem}
.def-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:.9rem 0 .35rem}
.formula-box{background:var(--teal-light);border-radius:10px;padding:.8rem 1rem;font-size:15px;font-weight:700;color:var(--teal-dark);text-align:center;margin:.5rem 0 .75rem;letter-spacing:.02em}
.ex-list{display:flex;flex-direction:column;gap:.45rem;margin:.25rem 0 .75rem}
.ex-item{background:var(--cream);border-radius:8px;padding:.55rem .85rem;font-size:13.5px;color:var(--text2);line-height:1.55;border-left:3px solid var(--teal-mid)}
.ex-item strong{color:var(--teal-dark)}
.ex-item s{color:var(--red-t);text-decoration-color:#E24B4A}
.contrast-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:.5rem 0 .75rem}
.cg-cell{padding:.6rem .85rem;border-radius:8px;font-size:13.5px;line-height:1.5}
.cg-cell.past{background:var(--amber-bg);color:var(--amber-t)}
.cg-cell.pp{background:var(--green-bg);color:var(--green-t)}
.cg-cell .cg-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.confusion-box{background:var(--amber-bg);border-left:3px solid #BA7517;border-radius:0 8px 8px 0;padding:.7rem 1rem;margin:.75rem 0}
.confusion-box .cb-title{font-size:11px;font-weight:700;color:var(--amber-t);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.confusion-box p{font-size:13px;color:var(--amber-t);line-height:1.55}
.tip-box{background:var(--blue-bg);border-radius:8px;padding:.65rem .9rem;margin-top:.75rem;font-size:13px;color:var(--blue-t);line-height:1.5}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-situation{background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:var(--teal-dark);margin-bottom:1rem}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:'Lato',sans-serif}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct,.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-word-tag{display:inline-block;font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:var(--teal);background:var(--teal-light);padding:4px 16px;border-radius:20px;margin-bottom:.75rem;border:1px solid #9FE1CB}
.write-ta{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;background:var(--cream);line-height:1.6}
.write-ta:focus{border-color:var(--teal-mid);background:#fff}
.print-mirror{display:none}
.export-box{background:var(--teal-light);border:1.5px dashed var(--teal-mid);border-radius:14px;padding:1.4rem;text-align:center;margin:1.5rem 0}
.export-box p{font-size:13px;color:var(--teal-dark);margin-bottom:.8rem}
.export-btn{background:var(--teal);color:#fff;border:none;padding:.7rem 1.6rem;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif}
.export-btn:hover{background:var(--teal-mid)}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn:hover{border-color:var(--teal-mid)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
@media print{
  .topbar,.info-bar,.phase-nav,.bottom-nav,.export-box{display:none !important}
  #phase-0{display:none !important}
  #phase-1,#phase-2{display:block !important}
  .write-ta{display:none !important}
  .print-mirror{display:block !important;white-space:pre-wrap;border:1px solid #999;border-radius:8px;padding:.6rem .85rem;font-size:12.5px;color:#000;background:#fff;margin-top:.2rem}
  .print-header{display:block !important;padding:0 0 1rem}
  .print-header h1{font-family:'Raleway',sans-serif;font-size:19px;color:#085041;margin-bottom:.3rem}
  .print-header .ph-meta{font-size:12px;color:#444}
  body{background:#fff}.shell{padding:1rem;max-width:100%}
  .quiz-card,.write-card,.rule-card{box-shadow:none;break-inside:avoid;border:1px solid #ccc}
  .q-opt.correct,.q-opt.revealed,.q-opt.incorrect{border-width:2px !important}
  .contrast-grid{grid-template-columns:1fr}
  .section-intro p{display:none}
}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}.contrast-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">Grammar Builder — Week 11</div><div class="topbar-sub">English with Ali · Present Perfect</div></div>
  <div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:33%"></div></div><span class="prog-label" id="prog-label">Phase 1 of 3</span></div>
</div>
<div class="info-bar"><label for="sname">Your name:</label><input type="text" id="sname" placeholder="Jessi"></div>
<div class="print-header" id="print-header"></div>
<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Learn</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Quiz</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>
<script>
var QUIZ=[
  {id:'q1',situation:'You want to say your team improved the process at some point before now — and the result is still visible today.',
   prompt:'Which sentence uses present perfect correctly?',
   options:['My team has improved the process significantly.','My team improved the process significantly.','My team is improved the process significantly.','My team improves the process significantly.'],
   correct:0,explain:'"Has improved" = present perfect. The improvement happened before now and the result is still relevant today. Simple past ("improved") just states it happened — present perfect connects it to the present.'},
  {id:'q2',situation:'A payment issue was fixed and the client has already been informed — you\'re writing a status update now.',
   prompt:'Which sentence is correct?',
   options:['The client notified.','The client has been notified.','The client was notify.','The client is notifying.'],
   correct:1,explain:'"Has been notified" = present perfect passive. The action happened before now and is directly relevant to the current status. This is the structure: has/have + been + past participle.'},
  {id:'q3',situation:'You are describing your total experience in your current role on your performance review.',
   prompt:'Which sentence is correct?',
   options:['I work on regulatory compliance since 2022.','I worked on regulatory compliance since 2022.','I am working on regulatory compliance since 2022.','I have worked on regulatory compliance since 2022.'],
   correct:3,explain:'"Have worked since 2022" = present perfect for a situation that started in the past and continues now. With "since" or "for," always use present perfect — never simple past or present continuous.'},
  {id:'q4',situation:'You want to report that confirmation has not arrived yet — the situation is still ongoing.',
   prompt:'Which sentence is correct?',
   options:['The client not received confirmation yet.','The client didn\'t received confirmation yet.','The client hasn\'t received confirmation yet.','The client wasn\'t received confirmation yet.'],
   correct:2,explain:'"Hasn\'t received" = present perfect negative. "Yet" signals we\'re talking about a period up to now — always use present perfect with "yet." Never "didn\'t received" (wrong auxiliary) or "wasn\'t received" (wrong tense).'},
  {id:'q5',situation:'Your manager asks if you sent the report. You did it 10 minutes ago and it\'s relevant right now.',
   prompt:'Which answer uses present perfect correctly?',
   options:['Yes, I sended it just now.','Yes, I have just sent it.','Yes, I was sent it.','Yes, I am sending it now.'],
   correct:1,explain:'"Have just sent" = present perfect with "just" for very recent actions. "Just" signals the action happened moments ago and is still relevant. Never "sended" — the past participle of "send" is "sent."'},
  {id:'q6',situation:'You want to say the funds were returned to the sender and the effect is still visible in the system now.',
   prompt:'Which sentence uses present perfect passive correctly?',
   options:['The funds were returned to the sender.','The funds return to the sender.','The funds has returned to the sender.','The funds have been returned to the sender.'],
   correct:3,explain:'"Have been returned" = present perfect passive. Structure: have/has + been + past participle. "Were returned" is simple past passive — it works but only describes the past, not the connection to now. With a plural subject (funds), use "have" not "has."'},
  {id:'q7',situation:'You are writing a professional email opening. You want to connect your recent review of the ACH process to the present moment.',
   prompt:'Which sentence is the most natural present perfect opener?',
   options:['I have reviewed the ACH process and I have some observations to share.','I reviewed the ACH process and I have some observations to share.','I was reviewing the ACH process and I am having some observations.','I review the ACH process and I had some observations.'],
   correct:0,explain:'"Have reviewed" = present perfect for a recent action whose result (the observations) is relevant right now. This is a classic professional email opener — it connects what you did to what you\'re about to say.'}
];

var WRITE_TASKS=[
  {word:'present perfect — active',prompt:'Write 2 sentences about your work using present perfect (have/has + past participle). One should be positive, one negative with "yet" or "already."',hint:'Try: "My team has implemented..." / "The process has not been updated yet..."'},
  {word:'present perfect — passive',prompt:'Write 2 sentences about a payment or process issue using present perfect passive (has/have been + past participle).',hint:'Try: "The payment has been rejected..." / "The client has not been notified yet..." / "The issue has been escalated..."'},
  {word:'since / for / just / yet / already',prompt:'Write 3 short sentences using one of these signal words each: "since," "already," and "yet." Connect each to your real work context.',hint:'"I have worked on this process since..." / "The report has already been sent..." / "The reversal has not been processed yet..."'}
];

var currentPhase=0,quizAnswers={},writeAnswers={};
function updateProgress(){
  var labels=['Phase 1 of 3 — Learn','Phase 2 of 3 — Quiz','Phase 3 of 3 — Write'];
  document.getElementById('prog').style.width=[33,66,100][currentPhase]+'%';
  document.getElementById('prog-label').textContent=labels[currentPhase];
}
function goPhase(n){
  document.getElementById('phase-'+currentPhase).style.display='none';
  document.querySelectorAll('.phase-tab').forEach(function(t,i){t.classList.toggle('active',i===n);});
  currentPhase=n;document.getElementById('phase-'+n).style.display='block';
  updateProgress();window.scrollTo({top:0,behavior:'smooth'});
  if(n===0)renderLearn();if(n===1)renderQuiz();if(n===2)renderWrite();
}
function renderLearn(){
  document.getElementById('phase-0').innerHTML=
  '<div class="section-intro"><h2>Phase 1 — Learn the Rule</h2><p>Present perfect connects a past action to the present moment. You already used it correctly in your voice note — "I have made real progress in..." — this activity formalizes what you already know.</p></div>'+

  '<div class="rule-card">'+
    '<div class="rule-title">What is present perfect?</div>'+
    '<div class="rule-def">Present perfect is used when a past action has a <strong>connection to the present</strong> — the result is still visible, the action just happened, or the period of time includes now. It is NOT used for finished actions at a specific point in the past.</div>'+
    '<div class="formula-box">have / has + past participle</div>'+
    '<div class="def-label">The 4 main uses</div>'+
    '<div class="ex-list">'+
      '<div class="ex-item"><strong>1. Recent action, still relevant now:</strong> "The client <strong>has been notified.</strong>" → It just happened and matters now.</div>'+
      '<div class="ex-item"><strong>2. Experience (no specific time):</strong> "I <strong>have worked</strong> on ACH transfers for three years." → Ongoing from past to now.</div>'+
      '<div class="ex-item"><strong>3. Not happened yet:</strong> "The reversal <strong>has not been processed</strong> yet." → Still waiting, up to this moment.</div>'+
      '<div class="ex-item"><strong>4. Just completed:</strong> "I <strong>have just sent</strong> the report." → Moments ago, directly relevant.</div>'+
    '</div>'+

    '<div class="def-label">Present perfect vs. simple past — the key difference</div>'+
    '<div class="contrast-grid">'+
      '<div class="cg-cell past"><span class="cg-lbl">Simple past</span>"The payment <strong>was rejected</strong> yesterday." → Finished, specific time. No connection to now required.</div>'+
      '<div class="cg-cell pp"><span class="cg-lbl">Present perfect</span>"The payment <strong>has been rejected.</strong>" → Result is still relevant now. No specific time mentioned.</div>'+
    '</div>'+
    '<div class="contrast-grid">'+
      '<div class="cg-cell past"><span class="cg-lbl">Simple past</span>"I <strong>worked</strong> on this project last year." → Finished. Last year is over.</div>'+
      '<div class="cg-cell pp"><span class="cg-lbl">Present perfect</span>"I <strong>have worked</strong> on this project since January." → Started in past, still happening now.</div>'+
    '</div>'+

    '<div class="def-label">Signal words — these always go with present perfect</div>'+
    '<div class="ex-list">'+
      '<div class="ex-item"><strong>yet</strong> → "Has the report been sent <strong>yet</strong>?" / "The issue hasn\'t been resolved <strong>yet</strong>."</div>'+
      '<div class="ex-item"><strong>already</strong> → "The client has <strong>already</strong> been notified."</div>'+
      '<div class="ex-item"><strong>just</strong> → "The payment has <strong>just</strong> been submitted."</div>'+
      '<div class="ex-item"><strong>since / for</strong> → "She has managed this process <strong>since</strong> 2022." / "The account has been flagged <strong>for</strong> two days."</div>'+
    '</div>'+

    '<div class="def-label">Present perfect passive — for process reporting</div>'+
    '<div class="formula-box">has / have + been + past participle</div>'+
    '<div class="ex-list">'+
      '<div class="ex-item"><s>The client has notify.</s> → <strong>The client has been notified.</strong></div>'+
      '<div class="ex-item"><s>The funds has returned.</s> → <strong>The funds have been returned.</strong></div>'+
      '<div class="ex-item"><s>I have make progress.</s> → <strong>I have made real progress.</strong></div>'+
    '</div>'+

    '<div class="confusion-box"><div class="cb-title">⚠️ The most common error</div><p>"I have make progress" → "I have <strong>made</strong> progress." After have/has, always use the past participle — never the base verb. "Make" is irregular: make → made → made.</p></div>'+
    '<div class="tip-box">💡 Quick test: can you add "yesterday" or "last week" to the sentence? If yes → simple past. If the time is unspecified or "up to now" → present perfect.</div>'+
  '</div>'+

  '<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">1 rule — 4 uses — 5 signal words</span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Quiz →</button></div>';
}
function renderQuiz(){
  var el=document.getElementById('phase-1');
  var html='<div class="section-intro"><h2>Phase 2 — Quiz</h2><p>Choose the sentence that uses present perfect correctly in each situation.</p></div>';
  QUIZ.forEach(function(q,qi){
    var answered=quizAnswers[q.id]!==undefined;
    html+='<div class="quiz-card"><div class="quiz-num">Question '+(qi+1)+' of '+QUIZ.length+'</div>';
    html+='<div class="quiz-situation"><strong>Situation:</strong> '+q.situation+'</div>';
    html+='<div class="quiz-prompt">'+q.prompt+'</div><div class="quiz-options">';
    q.options.forEach(function(opt,oi){
      var cls='';if(answered){if(oi===q.correct)cls='revealed';else if(quizAnswers[q.id]===oi)cls='incorrect';}
      html+='<button class="q-opt '+cls+'" data-qid="'+q.id+'" data-oi="'+oi+'" onclick="answerQuiz(this)"><span class="q-letter">'+String.fromCharCode(65+oi)+'</span><span class="q-text">'+opt+'</span></button>';
    });
    html+='</div>';
    if(answered){var c=quizAnswers[q.id]===q.correct;html+='<div class="quiz-feedback '+(c?'correct':'incorrect')+' show">'+(c?'✓ ':'✗ ')+q.explain+'</div>';}
    html+='</div>';
  });
  var allDone=Object.keys(quizAnswers).length===QUIZ.length;
  html+='<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Back to Learn</button><button class="nav-btn primary" onclick="goPhase(2)" '+(allDone?'':'disabled')+'>Continue to Write →</button></div>';
  el.innerHTML=html;
}
function answerQuiz(btn){
  var qid=btn.dataset.qid,oi=parseInt(btn.dataset.oi);
  if(quizAnswers[qid]!==undefined)return;quizAnswers[qid]=oi;renderQuiz();
}
function renderWrite(){
  var el=document.getElementById('phase-2');
  var html='<div class="section-intro"><h2>Phase 3 — Write in Context</h2><p>Apply present perfect to real situations from your work. Use signal words where they fit naturally.</p></div>';
  WRITE_TASKS.forEach(function(task,ti){
    var val=writeAnswers[ti]||'';
    html+='<div class="write-card"><span class="write-word-tag">'+task.word+'</span>';
    html+='<div style="font-size:14px;font-weight:600;color:var(--text2);margin-bottom:.5rem">'+task.prompt+'</div>';
    html+='<div style="font-size:12px;color:var(--text3);margin-bottom:.65rem;font-style:italic">💭 '+task.hint+'</div>';
    html+='<textarea class="write-ta" id="wta-'+ti+'" placeholder="Write here..." oninput="writeAnswers['+ti+']=this.value">'+escHtml(val)+'</textarea>';
    html+='<div class="print-mirror" id="mirror-wta-'+ti+'"></div></div>';
  });
  html+='<div class="export-box"><p>📄 Done? Export your quiz responses and written answers as a PDF to submit.</p><button class="export-btn" onclick="exportPDF()">Export to PDF</button></div>';
  html+='<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Back to Quiz</button><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>';
  el.innerHTML=html;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function exportPDF(){
  var name=document.getElementById('sname').value.trim()||'_____________';
  var date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  document.getElementById('print-header').innerHTML='<h1>Grammar Builder — Week 11: Present Perfect</h1><div class="ph-meta"><strong>Student:</strong> '+escHtml(name)+' &nbsp;|&nbsp; <strong>Date:</strong> '+date+'</div>';
  renderQuiz();renderWrite();
  WRITE_TASKS.forEach(function(_,ti){var m=document.getElementById('mirror-wta-'+ti);if(m)m.textContent=writeAnswers[ti]&&writeAnswers[ti].trim()?writeAnswers[ti]:'(not answered)';});
  window.print();
}
renderLearn();updateProgress();
</script>
